services:
  db:
    image: pgvector/pgvector:pg16
    container_name: lenny-rag-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lenny_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-lenny_assistant}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lenny_user} -d ${POSTGRES_DB:-lenny_assistant}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
